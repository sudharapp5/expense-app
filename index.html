<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monthly Budget</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--bd:#e3e6ea;--ac:#4f46e5;--inc:#16a34a;--exp:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f29;--tx:#eceff4;--mut:#9aa3b2;--bd:#2a313d;--ac:#818cf8;--inc:#4ade80;--exp:#f87171}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f29;--tx:#eceff4;--mut:#9aa3b2;--bd:#2a313d;--ac:#818cf8;--inc:#4ade80;--exp:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.3rem;margin:0}
.month{display:flex;align-items:center;gap:6px}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px;width:100%;min-width:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.sum .card small{color:var(--mut);display:block}
.sum .card b{font-size:1.15rem}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:12px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}.sum b{font-size:1rem}}
form{display:grid;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.day{margin-bottom:12px}
.dh{display:flex;justify-content:space-between;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0}
.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.row .x{padding:2px 8px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px;overflow-x:auto;padding-bottom:2px}
.bars i{flex:1 0 8px;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.mut{color:var(--mut);font-size:.85rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>💰 Monthly Budget <button id="cfg" style="padding:2px 8px" aria-label="Settings">⚙</button></h1>
  <div class="month"><button id="pv">‹</button><input type="month" id="mo" style="width:auto"><button id="nx">›</button></div>
</header>
<div class="sum">
  <div class="card"><small>Income</small><b class="inc" id="si">0</b></div>
  <div class="card"><small>Expense</small><b class="exp" id="se">0</b></div>
  <div class="card"><small>Balance</small><b id="sb">0</b></div>
</div>
<div class="grid">
  <div>
    <div class="card">
      <form id="f">
        <div class="seg"><button type="button" id="t1" class="on">Expense</button><button type="button" id="t2">Income</button></div>
        <input id="nm" placeholder="What for? (e.g. coffee and vada)" required>
        <input id="am" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount ₹" required>
        <input id="dt" type="date" required>
        <button class="p" type="submit">Add</button>
      </form>
    </div>
    <div class="card" style="margin-top:12px"><div class="mut" style="margin-bottom:6px">Daily spending</div><div class="bars" id="bars"></div></div>
    <div class="tools"><button id="csv">Export CSV</button><span class="mut" id="st"></span></div>
  </div>
  <div class="card" id="list"></div>
</div>
</div>
<dialog id="dlg" style="border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:420px;width:92%">
<form method="dialog" id="cf" style="display:grid;gap:8px">
<b>Google Sheet connection</b>
<span class="mut">Paste the Web app URL and the password from your Apps Script.</span>
<input id="cu" placeholder="https://script.google.com/macros/s/.../exec">
<input id="ck" type="password" placeholder="Password (SECRET)">
<div class="seg"><button type="button" id="cc">Cancel</button><button class="p" id="cs">Save &amp; sync</button></div>
</form></dialog>
<script>
const $=id=>document.getElementById(id);
const LS='budget-v2';
let entries=[],queue=[],cfg={url:'',key:''},type='expense',cur=new Date().toISOString().slice(0,7),syncing=false,again=false;
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s){entries=s.entries||[];queue=s.queue||[];cfg=s.cfg||cfg}
 else{const o=JSON.parse(localStorage.getItem('budget-v1')||'null');if(o&&o.entries){entries=o.entries;queue=entries.map(e=>({op:'add',entry:e}))}}}catch(e){}
$('dt').value=new Date().toISOString().slice(0,10);$('mo').value=cur;
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify({entries,queue,cfg}))}catch(e){}};
const status=t=>$('st').textContent=t;
function apply(list,ops){let l=list.slice();ops.forEach(o=>{if(o.op==='add'){if(!l.some(x=>x.id===o.entry.id))l.push(o.entry)}else l=l.filter(x=>x.id!==o.id)});return l}
async function sync(){
  if(!cfg.url||!cfg.key)return status('Not connected to Google Sheet (⚙)');
  if(syncing){again=true;return}
  if(!navigator.onLine)return status('Offline · '+queue.length+' waiting to sync');
  syncing=true;const sent=queue.slice();status('Syncing…');
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,ops:sent})});
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    queue=queue.slice(sent.length);
    entries=apply(d.entries,queue);persist();render();
    status(queue.length?queue.length+' waiting to sync':'Synced ✓');
  }catch(e){status(String(e.message)==='auth'?'Wrong password (⚙)':'Offline · '+queue.length+' waiting to sync')}
  syncing=false;if(again){again=false;sync()}
}
function render(){
  const m=entries.filter(e=>e.date.startsWith(cur));
  const inc=m.filter(e=>e.type==='income').reduce((a,e)=>a+e.amount,0);
  const exp=m.filter(e=>e.type==='expense').reduce((a,e)=>a+e.amount,0);
  $('si').textContent=fmt(inc);$('se').textContent=fmt(exp);
  const b=inc-exp;$('sb').textContent=fmt(b);$('sb').className=b<0?'exp':'inc';
  const days={};m.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  const keys=Object.keys(days).sort().reverse();
  const L=$('list');L.innerHTML='';
  if(!keys.length)L.innerHTML='<div class="mut">No entries this month. Add your first one 👈</div>';
  keys.forEach(d=>{
    const tot=days[d].reduce((a,e)=>a+(e.type==='expense'?e.amount:0),0);
    const box=document.createElement('div');box.className='day';
    const h=document.createElement('div');h.className='dh';
    h.innerHTML='<span></span><span class="exp"></span>';
    h.children[0].textContent=new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    h.children[1].textContent=tot?'−'+fmt(tot):'';
    box.appendChild(h);
    days[d].forEach(e=>{
      const r=document.createElement('div');r.className='row';
      const n=document.createElement('span');n.className='n';n.textContent=e.name;
      const a=document.createElement('span');a.className=e.type==='income'?'inc':'exp';a.textContent=(e.type==='income'?'+':'−')+fmt(e.amount);
      const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Delete');
      x.onclick=()=>{if(confirm('Delete "'+e.name+'"?')){entries=entries.filter(i=>i.id!==e.id);queue.push({op:'del',id:e.id});persist();render();sync()}};
      r.append(n,a,x);box.appendChild(r);
    });
    L.appendChild(box);
  });
  const [y,mo]=cur.split('-').map(Number),dim=new Date(y,mo,0).getDate();
  const per=[];for(let i=1;i<=dim;i++){const k=cur+'-'+String(i).padStart(2,'0');per.push((days[k]||[]).reduce((a,e)=>a+(e.type==='expense'?e.amount:0),0))}
  const mx=Math.max(1,...per);$('bars').innerHTML=per.map((v,i)=>`<i title="Day ${i+1}: ${v}" style="height:${v/mx*100}%"></i>`).join('');
}
function setType(t){type=t;$('t1').className=t==='expense'?'on':'';$('t2').className=t==='income'?'on':''}
$('t1').onclick=()=>setType('expense');$('t2').onclick=()=>setType('income');
$('f').onsubmit=ev=>{
  ev.preventDefault();
  const a=parseFloat($('am').value);if(!(a>=0))return;
  const e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:$('dt').value,type,name:$('nm').value.trim(),amount:a};
  entries.push(e);queue.push({op:'add',entry:e});
  cur=e.date.slice(0,7);$('mo').value=cur;
  $('nm').value='';$('am').value='';$('nm').focus();persist();render();sync();
};
function shift(n){const [y,m]=cur.split('-').map(Number),d=new Date(y,m-1+n,1);cur=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');$('mo').value=cur;render()}
$('pv').onclick=()=>shift(-1);$('nx').onclick=()=>shift(1);
$('mo').onchange=()=>{if($('mo').value){cur=$('mo').value;render()}};
$('csv').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=['Date,Type,Description,Amount'].concat(entries.slice().sort((a,b)=>a.date<b.date?-1:1).map(e=>[e.date,e.type,q(e.name),e.amount].join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='budget.csv';document.body.appendChild(a);a.click();a.remove();
};
$('cfg').onclick=()=>{$('cu').value=cfg.url;$('ck').value=cfg.key;$('dlg').showModal()};
$('cc').onclick=()=>$('dlg').close();
$('cf').onsubmit=()=>{cfg={url:$('cu').value.trim(),key:$('ck').value};persist();sync()};
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync();
</script>
</body>
</html>
